[workspace]
members = ["crates/protocol", "crates/tray-host", "crates/windows-platform", "crates/worker", "crates/providers", "crates/app", "crates/core", "crates/storage"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = "=0.62.2"
protocol = { path = "crates/protocol" }
windows-platform = { path = "crates/windows-platform" }
providers = { path = "crates/providers" }
captions-core = { path = "crates/core" }
storage = { path = "crates/storage" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "system-proxy"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "renderer-skia", "raw-window-handle-06", "accessibility"] }
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = "full"
strip = "none"
