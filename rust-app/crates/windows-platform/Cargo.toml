[package]
name = "windows-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
captions-core.workspace = true
windows-numerics = "=0.3.1"
windows-core = "=0.62.2"
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant",
    "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_UI_Accessibility", "Win32_System_DataExchange", "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem",
    "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common"
] }

[features]
test-support = []
resource-probe = ["windows/Win32_System_Diagnostics_ProcessSnapshotting", "windows/Win32_System_Diagnostics_Debug", "windows/Win32_System_Kernel", "windows/Win32_System_ProcessStatus", "windows/Win32_Security_Cryptography"]
