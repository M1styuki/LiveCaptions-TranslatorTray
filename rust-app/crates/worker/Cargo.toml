[package]
name = "worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
protocol.workspace = true
windows-platform.workspace = true
gpui-kit.workspace = true
paste.workspace = true
futures.workspace = true
raw-window-handle.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }
providers.workspace = true
tokio.workspace = true
captions-core.workspace = true
storage.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
windows-platform = { workspace = true, features = ["test-support"] }
rusqlite = { version = "=0.40.1", features = ["bundled", "backup"] }
providers = { workspace = true, features = ["test-support"] }
reqwest.workspace = true

[features]
resource-probe = ["windows-platform/resource-probe"]

[[example]]
name = "host_resource_probe"
required-features = ["resource-probe"]
