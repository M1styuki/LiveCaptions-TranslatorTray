[package]
name = "worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
protocol.workspace = true
windows-platform.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
providers.workspace = true
tokio.workspace = true
captions-core.workspace = true
storage.workspace = true
serde_json.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
slint = { workspace = true, features = ["renderer-software"] }
windows-platform = { workspace = true, features = ["test-support"] }
rusqlite = { version = "=0.40.1", features = ["bundled", "backup"] }
providers = { workspace = true, features = ["test-support"] }
reqwest.workspace = true

[features]
resource-probe = ["windows-platform/resource-probe"]

[[example]]
name = "host_resource_probe"
required-features = ["resource-probe"]
