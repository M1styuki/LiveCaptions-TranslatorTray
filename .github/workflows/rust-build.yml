name: Rust Windows build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
      - name: Check formatting
        working-directory: rust-app
        run: cargo fmt --all -- --check
      - name: Compile UI before native dependencies
        working-directory: rust-app
        run: cargo build --release --package ui-check --locked
      - name: Build Windows x64 release and check caption shutdown
        env:
          LLVM_HOME: C:\Program Files\LLVM
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CLANG_PATH: C:\Program Files\LLVM\bin\clang.exe
        run: |
          git config --global core.longpaths true
          .\rust-app\tools\build.ps1 -Mode release
          Push-Location rust-app
          cargo test --release --package windows-platform --lib --locked captions::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Caption shutdown checks failed' }
          Pop-Location
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaptionsTray-win11-x64
          path: rust-app/target/x86_64-pc-windows-msvc/release/LiveCaptionsTray.exe
          if-no-files-found: error
